# Phase 7: the debug build runs here, on GitHub's Ubuntu runner, which ships an
# Android SDK. No release signing. The APK is uploaded as a short-lived
# workflow artifact and never committed.
name: android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not only the tip.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install gitleaks (official release, checksum pinned)
        run: |
          set -euo pipefail
          v=8.21.2
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_${v}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "gitleaks_${v}_linux_x64.tar.gz"
          gitleaks version

      - name: Clean-room and secrets gate
        run: ./scripts/clean-room-gate.sh

      - name: Permissions documented (source manifest)
        run: ./scripts/check-permissions.sh

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Permissions documented (merged manifest)
        run: |
          set -euo pipefail
          merged="$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml | grep -i merged | head -n 1)"
          test -n "$merged"
          ./scripts/check-permissions.sh "$merged"

      - name: APK path, size, sha256
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pip-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          retention-days: 7
