<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">One task, one yes</title>
  <desc id="d">Pip connects out to the owner's orchestrator over wss. A signed task arrives and waits on the phone for the owner's yes. Approved runs once; refused runs nothing; after five minutes it expires and runs nothing. Every step is written to the journal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F3A8F"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#FFF4E8"/>
  <rect x="14" y="14" width="1172" height="372" rx="20" fill="none" stroke="#2F3A8F" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Orchestrator -->
    <rect x="44" y="130" width="230" height="130" rx="22" fill="#FFFFFF" stroke="#2F3A8F" stroke-width="3"/>
    <text x="159" y="182" font-size="22" font-weight="700" fill="#1A1D33" text-anchor="middle">Ton orchestrateur</text>
    <text x="159" y="208" font-size="15" fill="#1A1D33" fill-opacity="0.7" text-anchor="middle">your orchestrator</text>
    <text x="159" y="236" font-size="14" fill="#2F3A8F" text-anchor="middle">tes appareils seulement</text>

    <!-- Link -->
    <path d="M286,195 L400,195" stroke="#2F3A8F" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="343" y="172" font-size="14" font-weight="700" fill="#2F3A8F" text-anchor="middle">wss:// sortant</text>
    <text x="343" y="226" font-size="13" fill="#1A1D33" fill-opacity="0.75" text-anchor="middle">signé HMAC</text>
    <text x="343" y="244" font-size="13" fill="#1A1D33" fill-opacity="0.75" text-anchor="middle">120 s max</text>

    <!-- Phone -->
    <rect x="412" y="36" width="300" height="328" rx="38" fill="#2F3A8F"/>
    <rect x="426" y="50" width="272" height="300" rx="28" fill="#1A1D33" fill-opacity="0.25"/>
    <g transform="translate(454,-10) scale(2)">
      <path fill="#7A4E2D" d="M54,34 L61.69,50.39 A8.5,8.5 0 1 1 46.31,50.39 Z"/>
      <path fill="#2FA36B" d="M54,34 Q53.5,27 60,25.5 Q61,32 54,34 Z"/>
      <circle cx="51" cy="49.2" r="1.9" fill="#1A1D33"/><circle cx="58.6" cy="49.2" r="1.9" fill="#1A1D33"/>
      <circle cx="51.7" cy="48.5" r="0.6" fill="#FFF4E8"/><circle cx="59.3" cy="48.5" r="0.6" fill="#FFF4E8"/>
      <path fill="#FFF4E8" d="M35,52 L73,52 L73,70 A16,16 0 0 1 57,86 L51,86 A16,16 0 0 1 35,70 Z"/>
      <path fill="#FF7A45" d="M39,55.5h2v1h-2z M43,55.5h2v1h-2z M47,55.5h2v1h-2z M51,55.5h2v1h-2z M55,55.5h2v1h-2z M59,55.5h2v1h-2z M63,55.5h2v1h-2z M67,55.5h2v1h-2z"/>
    </g>
    <text x="562" y="204" font-size="19" font-weight="700" fill="#FFF4E8" text-anchor="middle">Pip attend ton oui</text>
    <text x="562" y="228" font-size="14" fill="#FFF4E8" fill-opacity="0.8" text-anchor="middle">« Rappel : appeler Julie, 17 h »</text>
    <text x="562" y="258" font-size="15" font-weight="600" fill="#FF7A45" text-anchor="middle">
      Il reste <tspan>4:59</tspan>
    </text>
    <rect x="446" y="280" width="112" height="44" rx="22" fill="#FF7A45"/>
    <text x="502" y="308" font-size="17" font-weight="700" fill="#1A1D33" text-anchor="middle">Approuver</text>
    <rect x="568" y="280" width="112" height="44" rx="22" fill="none" stroke="#E5484D" stroke-width="2.5"/>
    <text x="624" y="308" font-size="17" font-weight="700" fill="#FFF4E8" text-anchor="middle">Refuser</text>

    <!-- Outcomes -->
    <path d="M724,200 C780,200 780,110 836,110" fill="none" stroke="#2F3A8F" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M724,200 L836,200" fill="none" stroke="#2F3A8F" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M724,200 C780,200 780,290 836,290" fill="none" stroke="#2F3A8F" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="846" y="80" width="316" height="60" rx="30" fill="#2FA36B"/>
    <text x="1004" y="106" font-size="17" font-weight="700" fill="#1A1D33" text-anchor="middle">Oui → exécutée une fois</text>
    <text x="1004" y="127" font-size="13" fill="#1A1D33" fill-opacity="0.8" text-anchor="middle">« Voilà, c'est rangé dans la poche. »</text>

    <rect x="846" y="170" width="316" height="60" rx="30" fill="#FFFFFF" stroke="#E5484D" stroke-width="2.5"/>
    <text x="1004" y="196" font-size="17" font-weight="700" fill="#1A1D33" text-anchor="middle">Non → rien ne bouge</text>
    <text x="1004" y="217" font-size="13" fill="#1A1D33" fill-opacity="0.75" text-anchor="middle">refus renvoyé, signé</text>

    <rect x="846" y="260" width="316" height="60" rx="30" fill="#FFFFFF" stroke="#1A1D33" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="1004" y="286" font-size="17" font-weight="700" fill="#1A1D33" text-anchor="middle">5 min → expirée</text>
    <text x="1004" y="307" font-size="13" fill="#1A1D33" fill-opacity="0.75" text-anchor="middle">rien ne bouge non plus</text>

    <text x="1004" y="356" font-size="14" font-weight="600" fill="#2F3A8F" text-anchor="middle">Tout est noté au journal, avec l'heure.</text>
  </g>
</svg>
